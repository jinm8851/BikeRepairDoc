plugins {
    id 'com.android.application'
  //  id 'org.jetbrains.kotlin.android'
   // id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.compose'

    // 코틀린 ksp 이전 플러그인
    id("com.google.devtools.ksp")

}



android {
    namespace 'myung.jin.bikerepairdoc'
    compileSdk 37


    defaultConfig {
        applicationId "myung.jin.bikerepairdoc"
        minSdk 26
        targetSdk 36
        versionCode 34
        versionName "34"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        ksp{
            // 프로젝트 폴더 내 'schemas'라는 폴더에 저장하도록 설정
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            // [중요] 용량을 줄이기 위해 true로 변경하세요!
            minifyEnabled true
            // 사용하지 않는 리소스 제거
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // [추가] 네이티브 디버그 기호를 App Bundle에 포함시킵니다.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

   /* kotlin {
        jvmToolchain(17) // <--- Java Toolchain을 17로 설정
    }*/

    buildFeatures{
        compose true
    }
    composeOptions{
        kotlinCompilerExtensionVersion "1.5.14"
    }
    packaging {
        resources {
            // 충돌하는 MANIFEST.MF 여러 파일 중 첫 번째로 발견된 파일만 패키지에 포함합니다.
            pickFirsts += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

dependencies {


    def room_version = "2.8.4"

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    //Room

    implementation("androidx.room:room-runtime:$room_version")
   // annotationProcessor("androidx.room:room-compiler:$room_version")

    ksp("androidx.room:room-compiler:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    //firebase
    implementation(platform("com.google.firebase:firebase-bom:34.17.0"))
   // implementation("com.google.firebase:firebase-analytics-ktx")
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    // firebaseAnalytics
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")

    implementation 'com.google.firebase:firebase-auth'
    implementation("com.google.firebase:firebase-firestore")
 // compose
    implementation(platform("androidx.compose:compose-bom:2026.06.01"))
    // other dependencies
    // Compose
   // implementation("androidx.activity:activity-compose:1.11.0")
    implementation("androidx.compose.material3:material3")
    // [삭제 추천] 코드에서 사용되지 않음 (XML 테마를 Compose로 옮길 때만 사용)
    // implementation("com.google.accompanist:accompanist-themeadapter-material3:0.36.0")

    debugImplementation("androidx.compose.ui:ui-tooling")
    // 이전 기존에 있던 종속성
   // implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
    // [수정] implementation에 있던 ui-tooling은 삭제하고 debugImplementation만 남기세요.
    // implementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    // [삭제 추천] 신원 인증 관련 특수 라이브러리인데 사용 중이지 않다면 삭제하세요.
   // implementation("com.android.identity:identity-jvm:202411.1")
    // [삭제 추천] 바이크 앱에 TV용 라이브러리가 포함되어 있습니다.
    // implementation("androidx.tv:tv-material:1.1.0")

    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")
    // navigation
    implementation("androidx.navigation:navigation-compose:2.9.8")
    // [삭제 추천] LiveData를 사용하지 않고 StateFlow만 사용한다면 삭제 가능합니다.
   // implementation("androidx.compose.runtime:runtime-livedata:1.11.4")
    // 자격증명
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    //구글 ID
    implementation("com.google.android.libraries.identity.googleid:googleid:1.2.0")
    // BoM을 사용할 때 Firebase 종속성에 버전을 지정하지 마세요


}