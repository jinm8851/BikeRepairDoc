plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
   // id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.compose'

    // 코틀린 ksp 이전 플러그인
    id("com.google.devtools.ksp")

}



android {
    namespace 'myung.jin.bikerepairdoc'
    compileSdk 36


    defaultConfig {
        applicationId "myung.jin.bikerepairdoc"
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName "31"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17) // <--- Java Toolchain을 17로 설정
    }

    buildFeatures{
        compose true
    }
    composeOptions{
        kotlinCompilerExtensionVersion "1.5.14"
    }
    packaging {
        resources {
            // 충돌하는 MANIFEST.MF 여러 파일 중 첫 번째로 발견된 파일만 패키지에 포함합니다.
            pickFirsts += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

dependencies {


    def room_version = "2.8.4"

    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    //Room

    implementation("androidx.room:room-runtime:$room_version")
   // annotationProcessor("androidx.room:room-compiler:$room_version")

    ksp("androidx.room:room-compiler:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    //firebase
    implementation(platform("com.google.firebase:firebase-bom:34.7.0"))
   // implementation("com.google.firebase:firebase-analytics-ktx")
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    // firebaseAnalytics
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")

    implementation 'com.google.firebase:firebase-auth'
    implementation("com.google.firebase:firebase-firestore")
 // compose
    implementation(platform("androidx.compose:compose-bom:2025.12.01"))
    // other dependencies
    // Compose
   // implementation("androidx.activity:activity-compose:1.11.0")
    implementation("androidx.compose.material3:material3")
    implementation("com.google.accompanist:accompanist-themeadapter-material3:0.36.0")

    debugImplementation("androidx.compose.ui:ui-tooling")
    // 이전 기존에 있던 종속성
   // implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("com.android.identity:identity-jvm:202411.1")
    implementation("androidx.tv:tv-material:1.0.1")

    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
    // navigation
    implementation("androidx.navigation:navigation-compose:2.9.6")
    implementation("androidx.compose.runtime:runtime-livedata:1.10.0")
    // 자격증명
    implementation("androidx.credentials:credentials:1.5.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.5.0")
    //구글 ID
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    // BoM을 사용할 때 Firebase 종속성에 버전을 지정하지 마세요


}